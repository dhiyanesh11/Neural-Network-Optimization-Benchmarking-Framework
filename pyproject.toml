[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnbench"
version = "0.1.0"
description = "A reproducible framework for neural network optimization and benchmarking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "pre-commit>=3.8"]
vision = ["torchvision>=0.16"]
nlp = ["transformers>=4.40,<5", "datasets>=2.18,<5"]

[project.scripts]
nnbench = "nnbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
