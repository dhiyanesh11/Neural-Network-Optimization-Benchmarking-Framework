name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,vision,nlp,export,analytics,dashboard]"
      - run: ruff check src tests scripts dashboard
      - run: black --check src tests scripts dashboard
      - run: pytest --cov=nnbench --cov-report=term-missing --cov-fail-under=80
      - run: nnbench run configs/experiment/demo.yaml --synthetic --db artifacts/ci.sqlite
